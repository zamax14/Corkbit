server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    # RFC 9728: los metadatos del recurso protegido viven en la raiz del host, no bajo /api.
    # Sin esto, la ruta canonica caia en el index.html del tablero y devolvia HTML con un 200.
    location /.well-known/oauth-protected-resource/ {
        proxy_pass http://api:8000/api/mcp/.well-known/oauth-protected-resource/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/mcp/ {
        # Sin URI en proxy_pass: nginx reenvia /api/mcp/ tal cual. La app monta MCP bajo su
        # ROOT_PATH (/api), asi que aqui el prefijo no se puede recortar como en /api/.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
