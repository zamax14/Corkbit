[project]
name = "crokbit-print-agent"
version = "0.1.0"
description = "Local ESC/POS print agent for Crokbit"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-escpos[usb]>=3.1,<4", "pydantic-settings>=2.7,<3"]

[project.scripts]
crokbit-print-agent = "crokbit_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crokbit_agent"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["escpos.*"]
ignore_missing_imports = true
